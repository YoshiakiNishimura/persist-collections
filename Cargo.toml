[package]
name = "persist-collections"
version = "0.1.0"
edition = "2024"
description = "Standard Rust collections with selectable snapshot formats"
license = "MIT"
repository = "https://github.com/YoshiakiNishimura/persist-collections"
readme = "README.md"

[features]
default = ["json", "msgpack", "postcard"]
json = ["dep:serde_json"]
msgpack = ["dep:rmp-serde"]
postcard = ["dep:postcard"]

[[bin]]
name = "persist-collections"
path = "src/main.rs"
required-features = ["json", "msgpack", "postcard"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
rmp-serde = { version = "1.3", optional = true }
postcard = { version = "1", default-features = false, features = ["use-std"], optional = true }
tempfile = "3"
