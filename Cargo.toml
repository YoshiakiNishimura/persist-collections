[package]
name = "persist-collections"
version = "0.1.0"
edition = "2024"
description = "Standard Rust collections with optional JSON snapshots"
license = "MIT"
repository = "https://github.com/YoshiakiNishimura/persist-collections"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
